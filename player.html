<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>My Web Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('assets/images/okok.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        #video-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.377);
            padding: 20px;
        }
        video {
            width: 100%;
        }
    </style>
</head>
<body>
    
    <!-- Your other content goes here -->
    <div id="video-container">
        <a class="trailer-link" href="https://www.youtube.com/results?search_query=Peaky+Blinders+Season+5+Official+Trailer+Netflix" target="_blank" rel="noopener">
            <img src="assets/images/backgroundmain222.jpg" alt="Peaky Blinders Season 5" style="width:100%;border-radius:8px">
            <p style="color:#fff;font-size:18px">&#9654; Watch the official trailer on YouTube</p>
        </a>
    </div>
</body>
</html>
